<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SRH (Safe Reach) — elevator & escalator supply, installation and maintenance in Makkah, Saudi Arabia." />
    <meta name="theme-color" content="#303451" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <title>SRH — Safe Reach for Elevators</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "SRH — Safe Reach for Elevators",
        "alternateName": "الوصول الآمن للمصاعد",
        "url": "https://srh-ksa.com",
        "telephone": ["+966571608000", "8001240604", "+966125395117"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Ibrahim Al-Jafali Street, Al-Awali District",
          "addressLocality": "Makkah Al-Mukarramah",
          "postalCode": "24372",
          "addressCountry": "SA"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 21.42,
          "longitude": 39.88
        },
        "areaServed": ["SA", "AE", "EG"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var storedTheme = localStorage.getItem('srh-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = storedTheme ? storedTheme === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', isDark);

        var storedLang = localStorage.getItem('srh-lang');
        var lang = storedLang === 'ar' ? 'ar' : 'en';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
